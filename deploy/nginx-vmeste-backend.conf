# Шаблон конфига nginx для реверс-прокси на бэкенд «Вместе».
#
# Установка:
#   sudo cp deploy/nginx-vmeste-backend.conf /etc/nginx/sites-available/vmeste-backend
#   sudo ln -s /etc/nginx/sites-available/vmeste-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Дальше certbot сам допишет сюда блок для порта 443 и редирект с 80 на 443
# (см. DEPLOY.md, шаг с certbot --nginx).
#
# Замените api.ваш-домен.ru на реальный (под)домен, указывающий на IP вашего VPS.

server {
    listen 80;
    listen [::]:80;
    server_name api.ваш-домен.ru;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
